    myang: { beat: chapter_cards, expression: evidence }
    status: planned

  # ── WEEK 4 — ENERGY & MAINTENANCE ─────────────────────────────────────────
  - day: 22
    format: short
    slug: hummingbird-torpor
    title: "The bird that powers down at night"
    pillar: body
    hook: "By day its heart beats 1,200 times a minute. At night, it drops to 50 — on purpose."
    facts:
      - fact: "Hummingbird hearts hit ~1,200 bpm in flight; at night they enter torpor and drop to ~50 bpm to survive until morning."
        source: "Lasiewski (1964, hummingbird energetics); torpor physiology literature"
      - fact: "They remember hundreds of individual flowers, when each refills, and skip the empties — episodic-like memory."
        source: "Healy & Hurly (flower-memory studies)"
      - fact: "Their wings are near-symmetrical, letting them fly backwards — the only bird that routinely does."
        source: "Hummingbird flight biomechanics literature (Cornell Lab of Ornithology)"
    myang: { beat: corner_reaction, expression: shock, moment: "at 1,200 bpm" }
    status: planned

  - day: 23
    format: short
    slug: sperm-whale
    title: "The loudest living thing talks in clans"
    pillar: records
    hook: "The loudest animal on Earth uses its sound not to attack — but to talk to family."
    facts:
      - fact: "Sperm whale clicks reach about 230 dB re 1 µPa at 1 m — the loudest sound made by any animal."
        source: "Richardson et al., Marine Mammals and Noise (1995)"
      - fact: "They dive over 2,000 m hunting squid in total darkness, navigating by echolocation."
        source: "Watwood et al., Journal of Experimental Biology (2006)"
      - fact: "Families share coda dialects; whales with similar 'songs' form vocal clans — culture without humans."
        source: "Rendell & Whitehead, Proceedings of the Royal Society B (2003)"
    myang: { beat: outro_stamp, expression: stamped }
    status: planned

  - day: 24
    format: short
    slug: icefish-blood
    title: "The fish with invisible blood"
    pillar: survival
    hook: "This fish's blood is clear. No red. No haemoglobin. It shouldn't work — it works."
    facts:
      - fact: "Icefish are the only vertebrates with no haemoglobin; their blood runs clear and carries little oxygen."
        source: "Ruud, Nature (1954)"
      - fact: "Compensation: giant gills, a huge heart pumping large volumes, and ice-cold water where oxygen dissolves easily."
        source: "Ruud (1954); Antarctic fish physiology literature"
      - fact: "Antifreeze glycoproteins keep their blood from freezing below 0 °C."
        source: "DeVries & Wohlschlag, Science (1969); DeVries (1971)"
    myang: { beat: corner_reaction, expression: squint, moment: "at the clear blood" }
    status: planned

  - day: 25
    format: short
    slug: vulture-acid
    title: "The stomach that eats anthrax"
    pillar: body
    hook: "This bird eats rotten, infected corpses — and its stomach acid nukes everything. Almost."
    facts:
      - fact: "Vulture stomach acid sits near pH 1, destroying most pathogens — including anthrax and botulism."
        source: "Roggenbuck et al., Nature Communications (2014)"
      - fact: "Their faces stay bald partly because feathers would trap gore their hygiene can't reach."
        source: "Vulture ecology literature (bald-head thermoregulation and hygiene hypothesis)"
      - fact: "A Rüppell's vulture holds the altitude record for any bird: about 11,300 metres, confirmed by an aircraft collision."
        source: "Laybourne, The Wilson Bulletin (1974)"
    myang: { beat: corner_reaction, expression: unimused, moment: "at the gross-out peak" }
    status: planned

  - day: 26
    format: short
    slug: archerfish
    title: "The fish that shoots with homework done"
    pillar: senses
    hook: "This fish shoots water jets at bugs above the water — and corrects for light bending as it aims."
    facts:
      - fact: "Archerfish spit precision jets to knock insects off overhangs, compensating for the light refraction at the water surface."
        source: "Schuster et al., Current Biology (2004, refraction compensation studies)"
      - fact: "They can learn the trick by watching a schoolmate hit a target — observational learning in a fish."
        source: "Schuster et al. (2004–2006 learning studies)"
      - fact: "The jet hits with a shaped flow that clusters water at the tip just before impact."
        source: "Archerfish jet dynamics literature (Vailati et al., 2012)"
    myang: { beat: corner_reaction, expression: smug, moment: "glasses-on aiming pose" }

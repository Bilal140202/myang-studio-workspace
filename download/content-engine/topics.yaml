  - day: 29
    format: short
    slug: sloth-budget
    title: "The price of being slow"
    pillar: body
    hook: "This animal risks its life once a week — for a bathroom trip. Everything else, it slows down."
    facts:
      - fact: "Three-toed sloths descend their tree about once a week to defecate — their single most dangerous routine."
        source: "Sloth ecology literature; Pauli et al., Proceedings of the Royal Society B (2014)"
      - fact: "That release can approach a third of their body weight — urine and faeces stored up all week."
        source: "Field studies of sloth defecation (documented in sloth ecology literature)"
      - fact: "Their fur farms algae for camouflage, and moths live in it — a three-way mutualism that fertilises the algae."
        source: "Pauli et al., Proceedings of the Royal Society B (2014)"
    myang: { beat: corner_reaction, expression: unimused, moment: "at the bathroom reveal" }
    status: planned

  - day: 30
    format: short
    slug: flamingo-leg
    title: "The one-leg trick physics explains"
    pillar: body
    hook: "Flamingos stand on one leg for hours. The twist? It takes no muscle at all."
    facts:
      - fact: "A passive mechanical lock in the flamingo's ankle joint lets it stand on one leg with near-zero muscle activity."
        source: "Chang & Ting, Biology Letters (2017)"

    pillar: body
    hook: "Cut off this salamander's leg, and it grows a perfect new one. Limb, bone, nerves, all of it."
    facts:
      - fact: "Axolotls regenerate limbs, tail, jaw, spinal cord and even sections of heart tissue without scarring."
        source: "Regeneration biology literature (Bryant & Gardiner; Tanaka); Nowoshilow et al., Nature (2018)"
      - fact: "Their genome is the largest ever decoded at the time — 32 billion base pairs, ten times a human's."
        source: "Nowoshilow et al., Nature (2018)"
      - fact: "They keep gills and stay aquatic for life — neoteny — while still being able to survive metamorphosis artificially."
        source: "Axolotl developmental biology (standard literature)"
    myang: { beat: corner_reaction, expression: shock, moment: "at regrowth timelapse" }
    status: planned


      - { file: "../_imgpool/planner-calendar-507074-01.jpg", type: image, parallax: false, query: "planner calendar", author: "Viajaste", license: "CC BY-SA 4.0", page: "https://commons.wikimedia.org/wiki/File:Icons8_flat_planner_green_calendar.png" }
